<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (unfilled) -->
  <defs>
    <linearGradient id="fillGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#ffcc00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:1"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main progress fill (this would be clipped by JavaScript based on progress) -->
  <rect x="0" y="0" width="400" height="24" fill="url(#fillGradient)" filter="url(#glow)"/>
  
  <!-- Highlight stripe -->
  <rect x="0" y="0" width="400" height="3" fill="#ffffff" opacity="0.4"/>
  
  <!-- Grid pattern -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.2">
    <line x1="20" y1="0" x2="20" y2="24"/>
    <line x1="40" y1="0" x2="40" y2="24"/>
    <line x1="60" y1="0" x2="60" y2="24"/>
    <line x1="80" y1="0" x2="80" y2="24"/>
    <line x1="100" y1="0" x2="100" y2="24"/>
    <line x1="120" y1="0" x2="120" y2="24"/>
    <line x1="140" y1="0" x2="140" y2="24"/>
    <line x1="160" y1="0" x2="160" y2="24"/>
    <line x1="180" y1="0" x2="180" y2="24"/>
    <line x1="200" y1="0" x2="200" y2="24"/>
    <line x1="220" y1="0" x2="220" y2="24"/>
    <line x1="240" y1="0" x2="240" y2="24"/>
    <line x1="260" y1="0" x2="260" y2="24"/>
    <line x1="280" y1="0" x2="280" y2="24"/>
    <line x1="300" y1="0" x2="300" y2="24"/>
    <line x1="320" y1="0" x2="320" y2="24"/>
    <line x1="340" y1="0" x2="340" y2="24"/>
    <line x1="360" y1="0" x2="360" y2="24"/>
    <line x1="380" y1="0" x2="380" y2="24"/>
  </g>
</svg>
